[project]
name = "selenium-reference-framework"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.5",
    "selenium>=4.36.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pypdf>=6.16.2",
    "pytest>=8.4.2",
    "pytest-html>=4.2.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
addopts = "--strict-markers"
markers = [
    "ui: browser tests against the Selenium test pages",
    "api: REST API tests, no browser",
    "bidi: tests that need a WebDriver BiDi session",
    "chrome_only(reason): skipped on other browsers, with the reason in the report",
]
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%H:%M:%S"

[tool.mypy]
files = ["framework"]
ignore_missing_imports = true
