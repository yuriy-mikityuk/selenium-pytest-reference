[project]
name = "selenium-reference-framework"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.5",
    "selenium>=4.36.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pypdf>=6.16.2",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.mypy]
files = ["framework"]
ignore_missing_imports = true
